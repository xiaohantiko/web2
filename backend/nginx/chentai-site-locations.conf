# Same-origin, read-only website gateway. Only the Directus endpoints needed
# by the public site are exposed; authentication and admin routes are not.
location = /cms-api/items/articles {
    proxy_pass http://127.0.0.1:8055/items/articles;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /cms-api/items/site_settings {
    proxy_pass http://127.0.0.1:8055/items/site_settings;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /cms-api/items/site_pages {
    proxy_pass http://127.0.0.1:8055/items/site_pages;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /cms-api/assets/ {
    proxy_pass http://127.0.0.1:8055/assets/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Public forms never write to Directus directly. This exact endpoint is
# validated, rate-limited and forwarded to the local inquiry service.
location = /api/inquiries {
    limit_except POST { deny all; }
    limit_req zone=chentai_inquiries burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;

    proxy_pass http://127.0.0.1:8060/inquiries;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

location / {
    try_files $uri $uri/ =404;
}
