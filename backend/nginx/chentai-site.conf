limit_req_zone $binary_remote_addr zone=chentai_inquiries:10m rate=6r/m;

# Keep direct-IP HTTP access available for deployment checks before the
# Tencent Cloud access filing is completed.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/chentai-site/current;
    index index.html;

    include /etc/nginx/snippets/chentai-site-locations.conf;
}

# Canonical public entry point. Both the apex and www hostnames use HTTPS;
# www is normalized to the apex hostname.
server {
    listen 80;
    listen [::]:80;

    server_name hebeict.cn www.hebeict.cn;
    return 301 https://hebeict.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name hebeict.cn;
    root /var/www/chentai-site/current;
    index index.html;

    ssl_certificate /etc/chentai-tls/hebeict.cn/fullchain.pem;
    ssl_certificate_key /etc/chentai-tls/hebeict.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/chentai-site-locations.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.hebeict.cn;

    ssl_certificate /etc/chentai-tls/hebeict.cn/fullchain.pem;
    ssl_certificate_key /etc/chentai-tls/hebeict.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hebeict.cn$request_uri;
}
