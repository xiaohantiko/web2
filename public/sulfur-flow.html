<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>含H₂S尾气 Na₂CO₃吸收—氧化再生—硫回收动态流程图</title>
<style>
  :root{
    --gas:#f26b16;
    --alkali:#168a2f;
    --air:#1e73d8;
    --sulfur:#d59a00;
    --cat:#8d47d6;
    --return:#158338;
    --steel:#344054;
    --muted:#667085;
    --grid:#e6edf5;
    --bg:#f7fbff;
    --dash-duration:4s;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
    background:linear-gradient(180deg,#f5fbff 0%,#ffffff 45%,#f8fbff 100%);
    color:#0f172a;
  }
  .page{
    max-width:1500px;
    margin:0 auto;
    padding:18px 18px 22px;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    background:#ffffffcc;
    border:1px solid #d7e3ef;
    box-shadow:0 8px 24px rgba(15,23,42,.08);
    border-radius:16px;
    padding:12px 14px;
    backdrop-filter: blur(6px);
  }
  .title{
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
    white-space:nowrap;
  }
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  button{
    border:1px solid #c8d8e8;
    background:#fff;
    color:#0f172a;
    padding:8px 12px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    transition:.18s ease;
    box-shadow:0 2px 5px rgba(15,23,42,.06);
  }
  button:hover{transform:translateY(-1px); box-shadow:0 6px 14px rgba(15,23,42,.12);}
  button.active{background:#0f766e;color:white;border-color:#0f766e;}
  .speed{display:flex; align-items:center; gap:6px; color:#334155; font-size:13px; font-weight:700;}
  input[type=range]{accent-color:#0f766e;}
  .canvas-wrap{
    background:white;
    border:1px solid #d8e4ef;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 16px 40px rgba(15,23,42,.10);
  }
  svg{display:block;width:100%;height:auto;background:white;}
  .main-title{font-size:36px;font-weight:900;letter-spacing:1px;fill:#0b1220;}
  .subtle{fill:#475467;font-size:15px;font-weight:600;}
  .label{font-size:18px;font-weight:800;fill:#111827;}
  .small-label{font-size:15px;font-weight:700;fill:#111827;}
  .tiny{font-size:13px;font-weight:700;fill:#334155;}
  .formula{font-size:18px;font-weight:800;fill:#0f172a;}
  .equipment{cursor:pointer;transition:.2s ease;}
  .equipment .outline{stroke:#1f2937;stroke-width:2.2;fill:url(#metalGrad);}
  .equipment:hover .outline{stroke:#0f766e;stroke-width:3.5;filter:url(#glowGreen);}
  .equipment.highlight .outline{stroke:#0f766e;stroke-width:4;filter:url(#glowGreen);}
  .equipment.dim{opacity:.25;}
  .pipe{fill:none;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowDefault);opacity:.95;transition:.25s ease;}
  .pipe.gas{stroke:var(--gas);marker-end:url(#arrowGas);}
  .pipe.alkali{stroke:var(--alkali);marker-end:url(#arrowAlkali);}
  .pipe.air{stroke:var(--air);marker-end:url(#arrowAir);}
  .pipe.sulfur{stroke:var(--sulfur);marker-end:url(#arrowSulfur);}
  .pipe.cat{stroke:var(--cat);marker-end:url(#arrowCat);}
  .pipe.return{stroke:var(--return);stroke-dasharray:12 9;marker-end:url(#arrowReturn);}
  .pipe.aux{stroke:#99a2b0;stroke-width:2.2;marker-end:none;opacity:.55;}
  .flowing{stroke-dasharray:22 18;animation:flowDash var(--dash-duration) linear infinite;}
  @keyframes flowDash{to{stroke-dashoffset:-120;}}
  body.paused .flowing{animation-play-state:paused;}
  .particle{filter:url(#glowWhite);opacity:.95;}
  .pulse{animation:pulse 1.5s ease-in-out infinite; transform-origin:center; transform-box:fill-box;}
  body.paused .pulse{animation-play-state:paused;}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
  .sprayLine{stroke:#46a6ff;stroke-width:1.5;stroke-dasharray:5 5;animation:rain 1.1s linear infinite;}
  @keyframes rain{to{stroke-dashoffset:20;}}
  .mixBlade{animation:spin 2.4s linear infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.paused .mixBlade, body.paused .sprayLine{animation-play-state:paused;}
  .fanBlade{animation:spin 1.2s linear infinite;transform-origin:center;transform-box:fill-box;}
  body.paused .fanBlade{animation-play-state:paused;}
  .steam{animation:steam 2s ease-in-out infinite;opacity:.45;}
  @keyframes steam{0%{transform:translateY(6px);opacity:.1}50%{opacity:.55}100%{transform:translateY(-8px);opacity:.05}}
  body.paused .steam{animation-play-state:paused;}
  .liquid-wave{animation:wave 2.8s ease-in-out infinite alternate;}
  @keyframes wave{to{transform:translateX(8px)}}
  body.paused .liquid-wave{animation-play-state:paused;}
  .legend-box{fill:#ffffff;stroke:#b8c8dc;stroke-width:2;stroke-dasharray:9 7;}
  .note-box{fill:#fbfff4;stroke:#7bbf62;stroke-width:2;}
  .info-panel{
    position:absolute;
    right:32px;
    bottom:30px;
    width:min(420px,calc(100% - 64px));
    background:#ffffffee;
    border:1px solid #c8d8e8;
    border-radius:14px;
    box-shadow:0 14px 30px rgba(15,23,42,.15);
    padding:14px 16px;
    display:none;
    backdrop-filter:blur(6px);
  }
  .canvas-area{position:relative;}
  .info-panel.show{display:block;}
  .info-title{font-size:18px;font-weight:900;margin-bottom:7px;color:#0f766e;}
  .info-text{font-size:14px;line-height:1.65;color:#334155;}
  .close{position:absolute;right:10px;top:8px;border:none;background:transparent;font-size:18px;cursor:pointer;color:#64748b;}
  .dim-target{opacity:.18!important;}
  .focus-target{opacity:1!important;filter:url(#focusGlow);}
  .mode-note{
    font-size:13px;color:#475467;margin-top:8px;line-height:1.4;
  }
  .badge{font-size:12px;font-weight:800;fill:#fff;}
  @media(max-width:760px){.title{font-size:16px}.toolbar{align-items:flex-start}.main-title{font-size:26px}.label{font-size:15px}.small-label{font-size:12px}}
</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <div>
      <div class="title">动态流程图：含H₂S尾气 Na₂CO₃吸收—氧化再生—硫回收</div>
      <div class="mode-note">可播放/暂停、切换工况、点击设备查看说明；彩色管线带流动动画。</div>
    </div>
    <div class="controls">
      <button id="playBtn">暂停动画</button>
      <button class="mode active" data-mode="all">总览</button>
      <button class="mode" data-mode="absorb">吸收喷淋</button>
      <button class="mode" data-mode="wash">洗涤排放</button>
      <button class="mode" data-mode="oxidize">氧化再生</button>
      <button class="mode" data-mode="sulfur">硫回收</button>
      <button class="mode" data-mode="recycle">回流循环</button>
      <label class="speed">速度 <input id="speed" type="range" min="0.5" max="2" value="1" step="0.1"><span id="speedVal">1.0×</span></label>
    </div>
  </div>

  <div class="canvas-wrap canvas-area">
  <svg id="diagram" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" aria-label="含H2S尾气Na2CO3吸收氧化再生硫回收动态流程图">
    <defs>
      <linearGradient id="metalGrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#eef3f8"/>
        <stop offset="0.28" stop-color="#ffffff"/>
        <stop offset="0.52" stop-color="#cfd8e3"/>
        <stop offset="0.78" stop-color="#f9fbfd"/>
        <stop offset="1" stop-color="#d8e0ea"/>
      </linearGradient>
      <linearGradient id="blueLiquid" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#c9eeff"/>
        <stop offset="1" stop-color="#3aa4e8"/>
      </linearGradient>
      <linearGradient id="sulfurGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#ffe59a"/>
        <stop offset="1" stop-color="#e2a900"/>
      </linearGradient>
      <filter id="glowWhite" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.55 0 0 0 0 0.33 0 0 0 .55 0"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="focusGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="blur"/>
        <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.62 0 0 0 0 1 0 0 0 .55 0"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <marker id="arrowGas" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#f26b16"/></marker>
      <marker id="arrowAlkali" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#168a2f"/></marker>
      <marker id="arrowAir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1e73d8"/></marker>
      <marker id="arrowSulfur" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#d59a00"/></marker>
      <marker id="arrowCat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#8d47d6"/></marker>
      <marker id="arrowReturn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#158338"/></marker>
      <pattern id="packing" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M0 0L24 24M24 0L0 24" stroke="#8ab7df" stroke-width="1.5"/>
      </pattern>
      <pattern id="sulfurDots" width="16" height="16" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="#ffe2a3"/>
        <circle cx="4" cy="5" r="1.2" fill="#c98900"/><circle cx="12" cy="10" r="1.1" fill="#c98900"/><circle cx="7" cy="14" r=".9" fill="#c98900"/>
      </pattern>
    </defs>

    <rect x="0" y="0" width="1600" height="900" fill="#fff"/>
    <text x="800" y="54" text-anchor="middle" class="main-title">含H₂S尾气 Na₂CO₃吸收—氧化再生—硫回收工艺流程图</text>

    <!-- Invisible grouping backgrounds for modes -->
    <g id="pipes">
      <!-- gas paths -->
      <path id="pGasFeed" class="pipe gas flowing" data-group="absorb gas" d="M38 412 L132 412 L132 445"/>
      <path id="pGasToWash" class="pipe gas flowing" data-group="wash gas" d="M215 160 L295 160 L295 235 L355 235"/>
      <path id="pVent" class="pipe gas flowing" data-group="wash gas" d="M425 155 L425 105 L555 105"/>
      <!-- liquid paths -->
      <path id="pAbsToTank" class="pipe alkali flowing" data-group="absorb recycle" d="M174 612 L174 650 L280 650"/>
      <path id="pNaHS" class="pipe alkali flowing" data-group="absorb oxidize" d="M340 646 L618 646"/>
      <path id="pRegen1" class="pipe alkali flowing" data-group="oxidize recycle" d="M630 475 L430 475 L430 150 L195 150"/>
      <path id="pSpray" class="pipe alkali flowing" data-group="absorb recycle" d="M195 150 L195 192"/>
      <!-- air and catalyst -->
      <path id="pAir" class="pipe air flowing" data-group="oxidize air" d="M900 382 L818 382"/>
      <path id="pCatalyst" class="pipe cat flowing" data-group="oxidize catalyst" d="M748 120 L748 260"/>
      <!-- sulfur train -->
      <path id="pSulfur1" class="pipe sulfur flowing" data-group="sulfur" d="M838 590 L965 590"/>
      <path id="pSulfur2" class="pipe sulfur flowing" data-group="sulfur" d="M1042 590 L1138 590"/>
      <path id="pSulfur3" class="pipe sulfur flowing" data-group="sulfur" d="M1248 590 L1328 590"/>
      <path id="pSulfur4" class="pipe sulfur flowing" data-group="sulfur" d="M1420 590 L1515 590"/>
      <!-- return filtration -->
      <path id="pFilterReturn" class="pipe return flowing" data-group="recycle sulfur" d="M1185 675 L1185 733 L280 733 L280 675"/>
      <!-- wash/oxidation gas vent auxiliary -->
      <path id="pOxOffGas" class="pipe gas flowing" data-group="wash oxidize gas" d="M812 292 L812 210 L512 210 L512 155 L425 155"/>
      <!-- thin auxiliary connections -->
      <path class="pipe aux" data-group="absorb" d="M132 445 L132 200"/>
      <path class="pipe aux" data-group="oxidize" d="M730 262 L730 328"/>
    </g>

    <!-- Animated particles -->
    <g id="particles">
      <circle r="7" fill="#fff" stroke="#f26b16" stroke-width="3" class="particle" data-group="absorb gas"><animateMotion data-base="3.4" dur="3.4s" repeatCount="indefinite"><mpath href="#pGasFeed"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#f26b16" stroke-width="3" class="particle" data-group="wash gas"><animateMotion data-base="4.2" dur="4.2s" repeatCount="indefinite"><mpath href="#pGasToWash"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#f26b16" stroke-width="3" class="particle" data-group="wash gas"><animateMotion data-base="4.2" dur="4.2s" repeatCount="indefinite" begin="1s"><mpath href="#pVent"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#168a2f" stroke-width="3" class="particle" data-group="absorb recycle"><animateMotion data-base="4" dur="4s" repeatCount="indefinite"><mpath href="#pAbsToTank"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#168a2f" stroke-width="3" class="particle" data-group="absorb oxidize"><animateMotion data-base="5" dur="5s" repeatCount="indefinite"><mpath href="#pNaHS"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#168a2f" stroke-width="3" class="particle" data-group="oxidize recycle"><animateMotion data-base="7" dur="7s" repeatCount="indefinite"><mpath href="#pRegen1"/></animateMotion></circle>
      <circle r="6" fill="#fff" stroke="#1e73d8" stroke-width="3" class="particle" data-group="oxidize air"><animateMotion data-base="2.5" dur="2.5s" repeatCount="indefinite"><mpath href="#pAir"/></animateMotion></circle>
      <circle r="6" fill="#fff" stroke="#8d47d6" stroke-width="3" class="particle" data-group="oxidize catalyst"><animateMotion data-base="2.7" dur="2.7s" repeatCount="indefinite"><mpath href="#pCatalyst"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#d59a00" stroke-width="3" class="particle" data-group="sulfur"><animateMotion data-base="3" dur="3s" repeatCount="indefinite"><mpath href="#pSulfur1"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#d59a00" stroke-width="3" class="particle" data-group="sulfur"><animateMotion data-base="3" dur="3s" repeatCount="indefinite" begin=".8s"><mpath href="#pSulfur2"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#d59a00" stroke-width="3" class="particle" data-group="sulfur"><animateMotion data-base="3" dur="3s" repeatCount="indefinite" begin="1.2s"><mpath href="#pSulfur3"/></animateMotion></circle>
      <circle r="7" fill="#fff" stroke="#d59a00" stroke-width="3" class="particle" data-group="sulfur"><animateMotion data-base="3" dur="3s" repeatCount="indefinite" begin="1.6s"><mpath href="#pSulfur4"/></animateMotion></circle>
      <circle r="6" fill="#fff" stroke="#158338" stroke-width="3" class="particle" data-group="recycle sulfur"><animateMotion data-base="9" dur="9s" repeatCount="indefinite"><mpath href="#pFilterReturn"/></animateMotion></circle>
    </g>

    <!-- Absorption tower -->
    <g class="equipment" id="eqAbsorber" data-info-title="吸收塔（碱喷淋塔）" data-info="含H₂S尾气从塔底进入，Na₂CO₃喷淋液自塔顶喷淋，气液充分接触后生成NaHS溶液。塔顶气体进入水喷淋洗涤塔。" data-group="absorb recycle gas">
      <rect class="outline" x="110" y="190" width="120" height="430" rx="60"/>
      <ellipse cx="170" cy="220" rx="60" ry="25" fill="#f5f8fb" stroke="#1f2937" stroke-width="1.8"/>
      <rect x="120" y="250" width="100" height="120" fill="url(#packing)" stroke="#64748b" stroke-width="1.2"/>
      <rect x="120" y="445" width="100" height="105" fill="url(#packing)" stroke="#64748b" stroke-width="1.2"/>
      <rect x="120" y="370" width="100" height="75" fill="#d8edff" opacity=".75" stroke="#64748b" stroke-width="1"/>
      <text x="170" y="432" text-anchor="middle" class="label">吸收塔</text>
      <text x="170" y="462" text-anchor="middle" class="small-label">（碱喷淋塔）</text>
      <line x1="170" y1="205" x2="130" y2="260" class="sprayLine"/>
      <line x1="170" y1="205" x2="170" y2="270" class="sprayLine"/>
      <line x1="170" y1="205" x2="210" y2="260" class="sprayLine"/>
      <circle cx="170" cy="202" r="9" fill="#eef8ff" stroke="#334155" stroke-width="2"/>
    </g>
    <text x="20" y="405" class="label">含H₂S尾气</text>
    <text x="195" y="106" text-anchor="middle" class="small-label">Na₂CO₃喷淋液</text>
    <text x="195" y="128" text-anchor="middle" class="small-label">（来自循环）</text>

    <!-- Wash tower -->
    <g class="equipment" id="eqWash" data-info-title="水喷淋洗涤塔" data-info="吸收后的尾气经水喷淋洗涤，进一步去除夹带碱液和残余污染物，达到排放要求后排空。" data-group="wash gas">
      <rect class="outline" x="355" y="150" width="70" height="220" rx="35"/>
      <rect x="363" y="195" width="54" height="105" fill="url(#packing)" stroke="#7aa6d8"/>
      <rect x="363" y="300" width="54" height="35" fill="url(#blueLiquid)" opacity=".65"/>
      <circle cx="390" cy="170" r="7" fill="#eef8ff" stroke="#334155" stroke-width="1.8"/>
      <line x1="390" y1="172" x2="370" y2="212" class="sprayLine"/>
      <line x1="390" y1="172" x2="390" y2="218" class="sprayLine"/>
      <line x1="390" y1="172" x2="410" y2="212" class="sprayLine"/>
    </g>
    <text x="438" y="246" class="label">水喷淋</text><text x="438" y="276" class="label">洗涤塔</text>
    <text x="575" y="103" class="small-label">净化尾气排放</text><text x="575" y="126" class="small-label">（达标排放）</text>

    <!-- Intermediate tank -->
    <g class="equipment" id="eqMiddleTank" data-info-title="中间槽（循环槽）" data-info="接收吸收塔底部NaHS溶液，并作为循环、缓冲与回流液收集单元。滤液回流也可返回该槽。" data-group="absorb recycle">
      <rect class="outline" x="275" y="605" width="95" height="90" rx="12"/>
      <path class="liquid-wave" d="M282 666 C300 656,320 674,340 662 C352 654,362 664,368 660 L368 690 L282 690 Z" fill="url(#blueLiquid)" opacity=".75"/>
      <circle cx="303" cy="603" r="11" fill="#eef3f8" stroke="#334155"/>
      <circle cx="344" cy="603" r="11" fill="#eef3f8" stroke="#334155"/>
      <path d="M315 656 Q323 646 331 656 Q323 664 315 656" fill="none" stroke="#1f2937" stroke-width="2" class="mixBlade"/>
    </g>
    <text x="323" y="644" text-anchor="middle" class="label">中间槽</text>
    <text x="323" y="674" text-anchor="middle" class="small-label">（循环槽）</text>
    <text x="500" y="634" class="small-label">NaHS溶液</text>
    <text x="510" y="457" class="small-label">再生Na₂CO₃溶液</text><text x="530" y="480" class="small-label">（循环使用）</text>

    <!-- Oxidation tank -->
    <g class="equipment" id="eqOxidation" data-info-title="氧化槽（氧化塔）" data-info="加入PDF催化剂并鼓入空气，在催化作用下NaHS被氧化生成单质硫，同时Na⁺与CO₃²⁻重新生成Na₂CO₃，实现吸收液再生循环。" data-group="oxidize recycle air catalyst sulfur">
      <rect class="outline" x="630" y="280" width="210" height="355" rx="55"/>
      <ellipse cx="735" cy="300" rx="105" ry="38" fill="#f4f7fb" stroke="#1f2937" stroke-width="2"/>
      <rect x="718" y="235" width="34" height="64" fill="url(#metalGrad)" stroke="#1f2937" stroke-width="1.8"/>
      <rect x="708" y="220" width="54" height="24" rx="4" fill="url(#metalGrad)" stroke="#1f2937" stroke-width="1.8"/>
      <line x1="735" y1="300" x2="735" y2="515" stroke="#1f2937" stroke-width="2"/>
      <path d="M704 520 Q733 505 764 520 Q733 536 704 520" fill="none" stroke="#1f2937" stroke-width="3" class="mixBlade"/>
      <text x="735" y="410" text-anchor="middle" class="label">氧化槽</text>
      <text x="735" y="440" text-anchor="middle" class="small-label">（氧化塔）</text>
      <text x="735" y="485" text-anchor="middle" class="formula">NaHS → 单质硫</text>
      <text x="735" y="535" text-anchor="middle" class="formula">Na⁺ / CO₃²⁻ 再生为</text>

<script>
  const svg = document.getElementById('diagram');
  const playBtn = document.getElementById('playBtn');
  let paused = false;
  playBtn.addEventListener('click', () => {
    paused = !paused;
    document.body.classList.toggle('paused', paused);
    if (paused) { svg.pauseAnimations(); playBtn.textContent = '播放动画'; }
    else { svg.unpauseAnimations(); playBtn.textContent = '暂停动画'; }
  });

  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  function updateSpeed(){
    const v = parseFloat(speed.value);
    speedVal.textContent = v.toFixed(1)+'×';
    document.documentElement.style.setProperty('--dash-duration', (4 / v).toFixed(2)+'s');
    svg.querySelectorAll('animateMotion').forEach(a => {
      const base = parseFloat(a.dataset.base || '4');
      a.setAttribute('dur', (base / v).toFixed(2)+'s');
    });
  }
  speed.addEventListener('input', updateSpeed); updateSpeed();

  const modeButtons = document.querySelectorAll('button.mode');
  function setMode(mode){
    modeButtons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const allTargets = svg.querySelectorAll('[data-group]');
    if(mode === 'all'){
      allTargets.forEach(el => { el.classList.remove('dim-target','focus-target'); });
      return;
    }
    const map = {
      absorb:['absorb','gas','recycle'],
      wash:['wash','gas'],
      oxidize:['oxidize','air','catalyst','recycle'],
      sulfur:['sulfur'],
      recycle:['recycle','absorb','oxidize']
    };
    const groups = map[mode] || [];
    allTargets.forEach(el => {
      const g = (el.dataset.group || '').split(/\s+/);
      const hit = groups.some(x => g.includes(x));
      el.classList.toggle('dim-target', !hit);
      el.classList.toggle('focus-target', hit);
    });
  }
  modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));

  const panel = document.getElementById('infoPanel');
  const infoTitle = document.getElementById('infoTitle');
  const infoText = document.getElementById('infoText');
  const closeInfo = document.getElementById('closeInfo');
  svg.querySelectorAll('.equipment').forEach(eq => {
    eq.addEventListener('click', () => {
      svg.querySelectorAll('.equipment').forEach(e => e.classList.remove('highlight'));
      eq.classList.add('highlight');
      infoTitle.textContent = eq.dataset.infoTitle || '设备说明';
      infoText.textContent = eq.dataset.info || '';
      panel.classList.add('show');
    });
  });
  closeInfo.addEventListener('click', () => { panel.classList.remove('show'); svg.querySelectorAll('.equipment').forEach(e => e.classList.remove('highlight')); });
</script>
</body>
