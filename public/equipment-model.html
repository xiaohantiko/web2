<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Industrial Equipment Model</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main id="scene"></main>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.global.js"></script>
  <script>
    const sceneEl = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.76;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0xf4f7f5, 0);
    sceneEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xf2f6f4, 42, 96);

    const envCanvas = document.createElement("canvas");
    envCanvas.width = 512;
    envCanvas.height = 256;
    const envCtx = envCanvas.getContext("2d");
    const envGrad = envCtx.createLinearGradient(0, 0, 0, envCanvas.height);
    envGrad.addColorStop(0, "#ffffff");
    envGrad.addColorStop(0.3, "#dfe8e5");
    envGrad.addColorStop(0.52, "#8fa19d");
    envGrad.addColorStop(0.7, "#eef3f1");
    envGrad.addColorStop(1, "#3c4f4d");
    envCtx.fillStyle = envGrad;
    envCtx.fillRect(0, 0, envCanvas.width, envCanvas.height);
    envCtx.fillStyle = "rgba(255,255,255,.88)";
    envCtx.fillRect(42, 18, 150, 34);
    envCtx.fillRect(306, 34, 118, 24);
    const envTexture = new THREE.CanvasTexture(envCanvas);
    envTexture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = envTexture;

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 140);
    camera.position.set(11.8, 6.45, 10.85);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = 0.42;
    controls.target.set(0, 2.35, 0);
    controls.minDistance = 16.35;
    controls.maxDistance = 16.35;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minPolarAngle = Math.PI * 0.2;

    const hemi = new THREE.HemisphereLight(0xffffff, 0xa9bbb7, 1.08);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 3.05);
    key.position.set(5.6, 9.5, 7.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -12;
    key.shadow.camera.right = 12;
    key.shadow.camera.top = 10;
    key.shadow.camera.bottom = -9;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xf5fbff, 1.35);
    rim.position.set(-7, 5, -6);
    scene.add(rim);

    const warm = new THREE.DirectionalLight(0xfff4de, 0.9);
    warm.position.set(0, 4.8, 8);
    scene.add(warm);

    const softbox = new THREE.PointLight(0xffffff, 0.85, 18);
    softbox.position.set(-3.2, 6.8, 5.2);
    scene.add(softbox);

    const root = new THREE.Group();
    root.rotation.y = -0.14;
    scene.add(root);

    function material(options) {
      return new THREE.MeshStandardMaterial(options);
    }

    const matSteel = material({ color: 0x889493, metalness: 0.96, roughness: 0.22 });
    const matBrightSteel = material({ color: 0xaeb8b5, metalness: 0.98, roughness: 0.16 });
    const matDarkSteel = material({ color: 0x1f3034, metalness: 0.9, roughness: 0.3 });
    const matFrame = material({ color: 0x1d3236, metalness: 0.84, roughness: 0.36 });
    const matConcrete = material({ color: 0x9aa29c, metalness: 0.04, roughness: 0.68 });
    const matWall = material({ color: 0xdfe3df, metalness: 0.16, roughness: 0.52 });
    const matRib = material({ color: 0xf3f5f1, metalness: 0.24, roughness: 0.42 });
    const matBlueTrim = material({ color: 0x0f68a8, metalness: 0.38, roughness: 0.34 });
    const matYellow = material({ color: 0xffbd1a, metalness: 0.32, roughness: 0.34 });
    const matGreen = material({ color: 0x0f7a43, metalness: 0.45, roughness: 0.34 });
    const matDeepGreen = material({ color: 0x0b4f31, metalness: 0.5, roughness: 0.38 });
    const matCabinet = material({ color: 0xd8e0e4, metalness: 0.62, roughness: 0.3 });
    const matRubber = material({ color: 0x20282b, metalness: 0.35, roughness: 0.5 });
    const matCopper = material({ color: 0xb86c36, metalness: 0.72, roughness: 0.24 });
    const matGlass = material({ color: 0x153746, metalness: 0.18, roughness: 0.22, emissive: 0x0d3844, emissiveIntensity: 0.26 });
    const matBluePaint = material({ color: 0x006eb8, metalness: 0.44, roughness: 0.32 });
    const matRedPaint = material({ color: 0xbd2d26, metalness: 0.36, roughness: 0.36 });
    const matBlack = material({ color: 0x151b1d, metalness: 0.42, roughness: 0.46 });
    [matSteel, matBrightSteel, matDarkSteel, matFrame, matYellow, matGreen, matDeepGreen, matCabinet, matRubber, matCopper, matBluePaint, matRedPaint, matBlack].forEach((mat) => {
      mat.envMapIntensity = mat === matSteel || mat === matBrightSteel ? 0.45 : 0.34;
    });

    function setShadow(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function box(group, name, pos, scale, mat) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
      mesh.name = name;
      mesh.position.set(...pos);
      mesh.scale.set(...scale);
      group.add(setShadow(mesh));
      return mesh;
    }

    function cylinder(group, name, pos, radius, height, mat, axis = "y", radial = 48) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, radial), mat);
      mesh.name = name;
      mesh.position.set(...pos);
      if (axis === "x") mesh.rotation.z = Math.PI / 2;
      if (axis === "z") mesh.rotation.x = Math.PI / 2;
      group.add(setShadow(mesh));
      return mesh;
    }

    function pipe(group, name, a, b, r = 0.045, mat = matSteel, radial = 20) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const dir = end.clone().sub(start);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dir.length(), radial), mat);
      mesh.name = name;
      mesh.position.copy(start.clone().add(end).multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      group.add(setShadow(mesh));
      return mesh;
    }

    function polyPipe(group, name, points, r = 0.045, mat = matSteel) {
      for (let i = 0; i < points.length - 1; i += 1) {
        pipe(group, name, points[i], points[i + 1], r, mat, 20);
        const joint = new THREE.Mesh(new THREE.SphereGeometry(r * 1.48, 18, 12), mat);
        joint.position.set(...points[i + 1]);
        group.add(setShadow(joint));
      }
    }

    function vessel(group, name, pos, length, radius, axis = "x", mat = matSteel) {
      const g = new THREE.Group();
      g.name = name;
      g.position.set(...pos);

      const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 72), mat);
      if (axis === "x") body.rotation.z = Math.PI / 2;
      if (axis === "z") body.rotation.x = Math.PI / 2;
      g.add(setShadow(body));

      const capA = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 20), mat);
      const capB = capA.clone();
      if (axis === "x") {
        capA.scale.x = 0.45;
        capB.scale.x = 0.45;
        capA.position.x = -length / 2;
        capB.position.x = length / 2;
      } else if (axis === "z") {
        capA.scale.z = 0.45;
        capB.scale.z = 0.45;
        capA.position.z = -length / 2;
        capB.position.z = length / 2;
      } else {
        capA.scale.y = 0.38;
        capB.scale.y = 0.38;
        capA.position.y = -length / 2;
        capB.position.y = length / 2;
      }
      g.add(setShadow(capA), setShadow(capB));

      const capBoltCount = 12;
      [-length / 2, length / 2].forEach((offset) => {
        for (let i = 0; i < capBoltCount; i += 1) {
          const angle = (Math.PI * 2 * i) / capBoltCount;
          const bolt = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.035, 8, 6), matDarkSteel);
          if (axis === "x") {
            bolt.position.set(offset + (offset > 0 ? 0.02 : -0.02), Math.cos(angle) * radius * 0.72, Math.sin(angle) * radius * 0.72);
          } else if (axis === "z") {
            bolt.position.set(Math.cos(angle) * radius * 0.72, Math.sin(angle) * radius * 0.72, offset + (offset > 0 ? 0.02 : -0.02));
          } else {
            bolt.position.set(Math.cos(angle) * radius * 0.72, offset + (offset > 0 ? 0.02 : -0.02), Math.sin(angle) * radius * 0.72);
          }
          g.add(setShadow(bolt));
        }
      });

      const bandCount = Math.max(3, Math.floor(length / 0.65));
      for (let i = 0; i <= bandCount; i += 1) {
        const offset = -length / 2 + (length / bandCount) * i;
        const band = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.018, 0.018, 8, 58), matDarkSteel);
        if (axis === "x") {
          band.rotation.y = Math.PI / 2;
          band.position.x = offset;
        } else if (axis === "z") {
          band.rotation.x = Math.PI / 2;
          band.position.z = offset;
        } else {
          band.position.y = offset;
        }
        g.add(setShadow(band));
      }

      const nozzlePositions = axis === "x"
        ? [[-length * 0.25, radius + 0.12, 0], [length * 0.22, -radius - 0.12, 0.04], [0, 0, radius + 0.16]]
        : [[0, radius + 0.12, -length * 0.25], [0.04, -radius - 0.12, length * 0.24], [radius + 0.16, 0, 0]];
      nozzlePositions.forEach((p, index) => {
        const n = cylinder(g, `nozzle-${index}`, p, 0.075, 0.28, matBrightSteel, index === 2 ? "x" : "y", 20);
        if (axis === "x" && index === 2) n.rotation.z = 0;
      });

      const namePlate = new THREE.Mesh(new THREE.BoxGeometry(length * 0.14, radius * 0.16, 0.012), matRedPaint);
      if (axis === "x") {
        namePlate.position.set(length * 0.18, radius * 0.2, radius + 0.012);
      } else if (axis === "z") {
        namePlate.position.set(radius + 0.012, radius * 0.2, length * 0.18);
        namePlate.rotation.y = Math.PI / 2;
      } else {
        namePlate.position.set(radius + 0.012, length * 0.18, radius * 0.2);
      }
      if (axis !== "y") g.add(setShadow(namePlate));

      group.add(g);
      return g;
    }

    function verticalVessel(group, name, x, z, height, radius, y = 0.78) {
      const g = vessel(group, name, [x, y + height / 2, z], height, radius, "y", matSteel);
      for (let level = -height * 0.34; level <= height * 0.36; level += height * 0.17) {
        const tray = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.02, radius * 1.02, 0.026, 58), matDarkSteel);
        tray.position.y = level;
        g.add(setShadow(tray));
      }
      return g;
    }

    function supportFrame(group, x, z, w, d, h) {
      const g = new THREE.Group();
      g.position.set(x, 0.36, z);
      const xs = [-w / 2, w / 2];
      const zs = [-d / 2, d / 2];
      xs.forEach(px => zs.forEach(pz => pipe(g, "leg", [px, 0, pz], [px, h, pz], 0.04, matFrame, 12)));
      xs.forEach(px => {
        pipe(g, "top-side", [px, h, -d / 2], [px, h, d / 2], 0.04, matFrame, 12);
        pipe(g, "low-side", [px, 0.28, -d / 2], [px, 0.28, d / 2], 0.032, matFrame, 12);
      });
      zs.forEach(pz => {
        pipe(g, "top-front", [-w / 2, h, pz], [w / 2, h, pz], 0.04, matFrame, 12);
        pipe(g, "low-front", [-w / 2, 0.28, pz], [w / 2, 0.28, pz], 0.032, matFrame, 12);
      });
      group.add(g);
      return g;
    }

    function platform(group, x, y, z, w, d) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      box(g, "grating", [0, 0, 0], [w, 0.075, d], matFrame);
      for (let gx = -w / 2 + 0.18; gx < w / 2; gx += 0.28) {
        pipe(g, "grating-line", [gx, 0.06, -d / 2], [gx, 0.06, d / 2], 0.008, matDarkSteel, 8);
      }
      const xs = [-w / 2, -w / 6, w / 6, w / 2];
      const zs = [-d / 2, d / 2];
      xs.forEach(px => zs.forEach(pz => pipe(g, "rail-post", [px, 0.02, pz], [px, 0.82, pz], 0.022, matYellow, 8)));
      zs.forEach(pz => {
        pipe(g, "rail-top", [-w / 2, 0.82, pz], [w / 2, 0.82, pz], 0.026, matYellow, 8);
        pipe(g, "rail-mid", [-w / 2, 0.45, pz], [w / 2, 0.45, pz], 0.018, matYellow, 8);
      });
      [-w / 2, w / 2].forEach(px => {
        pipe(g, "rail-side", [px, 0.82, -d / 2], [px, 0.82, d / 2], 0.026, matYellow, 8);
        pipe(g, "rail-side-mid", [px, 0.45, -d / 2], [px, 0.45, d / 2], 0.018, matYellow, 8);
      });
      group.add(g);
      return g;
    }

    function ladder(group, x, z, y0, height, facing = "front") {
      const g = new THREE.Group();
      g.position.set(x, y0, z);
      const offset = facing === "side" ? 0.13 : 0;
      pipe(g, "side-a", [-0.16, 0, offset], [-0.16, height, offset], 0.018, matYellow, 8);
      pipe(g, "side-b", [0.16, 0, offset], [0.16, height, offset], 0.018, matYellow, 8);
      for (let y = 0.18; y < height; y += 0.28) {
        pipe(g, "rung", [-0.18, y, offset], [0.18, y, offset], 0.012, matYellow, 8);
      }
      group.add(g);
      return g;
    }

    function pump(group, x, y, z, colorMat = matBluePaint, rot = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.y = rot;
      box(g, "pump-base", [0, -0.24, 0], [0.92, 0.16, 0.46], colorMat);
      cylinder(g, "motor", [-0.2, 0.02, 0], 0.2, 0.56, matBlack, "x", 32);
      cylinder(g, "head", [0.32, 0.03, 0], 0.25, 0.26, matSteel, "x", 32);
      pipe(g, "suction", [0.48, 0.03, 0], [0.92, 0.03, 0], 0.045, matSteel);
      pipe(g, "discharge", [0.32, 0.26, 0], [0.32, 0.74, 0], 0.04, matSteel);
      group.add(g);
      return g;
    }

    function triangularGuard(group, x, y, z, scale = 1, rot = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.36, -0.34);
      shape.lineTo(0.4, -0.34);
      shape.lineTo(0.1, 0.44);
      shape.lineTo(-0.36, -0.34);
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), matYellow);
      mesh.position.set(x, y, z);
      mesh.scale.setScalar(scale);
      mesh.rotation.y = rot;
      group.add(setShadow(mesh));
      return mesh;
    }

    function greenModule(group, x, y, z, rot = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.y = rot;
      box(g, "green-box", [0, 0, 0], [0.96, 0.62, 0.58], matGreen);
      cylinder(g, "flywheel", [0.54, 0.02, 0], 0.28, 0.12, matDarkSteel, "x", 32);
      triangularGuard(g, 0.57, 0.04, 0.08, 0.72, 0);
      group.add(g);
      return g;
    }

    function blower(group, x, y, z, rot = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.y = rot;
      box(g, "blower-skid", [0, -0.28, 0], [1.05, 0.16, 0.62], matFrame);
      cylinder(g, "blower-scroll", [0.02, 0.02, 0], 0.34, 0.22, matDeepGreen, "z", 44);
      cylinder(g, "blower-inlet", [-0.34, 0.02, 0], 0.18, 0.2, matDarkSteel, "z", 32);
      cylinder(g, "blower-motor", [0.52, 0.02, 0], 0.2, 0.46, matBlack, "x", 32);
      cylinder(g, "blower-coupling", [0.28, 0.02, 0], 0.11, 0.18, matYellow, "x", 20);
      pipe(g, "blower-outlet", [0.02, 0.34, 0], [0.02, 0.72, 0], 0.055, matSteel, 16);
      group.add(g);
      return g;
    }

    function valve(group, x, y, z, axis = "x", color = matYellow) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.12, 22, 14), matDarkSteel);
      g.add(setShadow(ball));
      const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.012, 8, 28), color);
      wheel.position.y = 0.18;
      wheel.rotation.x = Math.PI / 2;
      g.add(setShadow(wheel));
      cylinder(g, "stem", [0, 0.1, 0], 0.014, 0.24, color, "y", 8);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.025, 0.045), matRedPaint);
      handle.position.y = 0.18;
      g.add(setShadow(handle));
      if (axis === "z") g.rotation.y = Math.PI / 2;
      group.add(g);
      return g;
    }

    function buildBase(group) {
      box(group, "front-beam", [0, 0.2, 3.48], [12.35, 0.32, 0.25], matFrame);
      box(group, "rear-beam", [0, 0.2, -3.48], [12.35, 0.32, 0.25], matFrame);
      box(group, "left-beam", [-6.08, 0.2, 0], [0.25, 0.32, 7.25], matFrame);
      box(group, "right-beam", [6.08, 0.2, 0], [0.25, 0.32, 7.25], matFrame);
      for (let x = -5.4; x <= 5.4; x += 0.9) {
        pipe(group, "floor-cross", [x, 0.38, -3.35], [x, 0.38, 3.35], 0.024, matFrame, 8);
      }
      for (let z = -2.8; z <= 2.9; z += 0.72) {
        pipe(group, "floor-long", [-5.8, 0.42, z], [5.8, 0.42, z], 0.022, matFrame, 8);
      }
    }

    function buildPipeRack(group) {
      const racks = [
        { z: 2.18, y: 1.76, x1: -5.45, x2: 5.45, count: 6, gap: 0.13 },
        { z: -2.42, y: 2.16, x1: -5.2, x2: 4.96, count: 7, gap: 0.12 },
        { z: 0.2, y: 3.03, x1: -2.85, x2: 4.65, count: 4, gap: 0.13 },
        { z: -0.82, y: 1.33, x1: -5.25, x2: 5.2, count: 4, gap: 0.12 }
      ];
      racks.forEach((rack, rackIndex) => {
        for (let i = 0; i < rack.count; i += 1) {
          const mat = (i + rackIndex) % 4 === 0 ? matCopper : ((i + rackIndex) % 3 === 0 ? matDarkSteel : matSteel);
          pipe(group, "pipe-rack", [rack.x1, rack.y + i * rack.gap, rack.z], [rack.x2, rack.y + i * rack.gap, rack.z], 0.028 + (i % 2) * 0.008, mat, 16);
        }
        for (let x = rack.x1; x <= rack.x2 + 0.2; x += 1.05) {
          pipe(group, "rack-post", [x, 0.52, rack.z], [x, rack.y + rack.count * rack.gap + 0.18, rack.z], 0.023, matFrame, 8);
          pipe(group, "rack-knee", [x - 0.18, 0.92, rack.z], [x + 0.18, 1.28, rack.z], 0.014, matFrame, 8);
        }
      });
    }

    function buildEquipment(group) {
      supportFrame(group, -3.85, 0.75, 1.9, 1.8, 1.58);
      supportFrame(group, -0.85, -1.05, 2.5, 2.2, 2.25);
      supportFrame(group, 3.86, -1.5, 2.2, 2.25, 2.72);
      supportFrame(group, 3.85, 1.75, 1.86, 2.3, 1.55);

      vessel(group, "front-long-horizontal-vessel", [-2.14, 1.42, 2.16], 4.55, 0.43, "x", matSteel);
      vessel(group, "rear-long-horizontal-vessel", [0.05, 1.43, -1.82], 5.18, 0.4, "x", matSteel);
      vessel(group, "upper-center-vessel", [-0.58, 3.38, -1.08], 2.2, 0.36, "x", matBrightSteel);
      vessel(group, "right-top-vessel", [3.95, 4.08, -1.35], 2.15, 0.42, "x", matBrightSteel);
      vessel(group, "right-lower-vessel", [4.12, 1.36, -2.45], 2.05, 0.35, "x", matSteel);
      vessel(group, "front-accumulator", [2.24, 1.08, 2.65], 1.85, 0.32, "x", matSteel);
      vessel(group, "left-receiver", [-4.72, 1.35, 0.82], 1.35, 0.34, "x", matBrightSteel);
      vessel(group, "rear-left-sphere-tank", [-5.02, 2.24, -1.78], 1.05, 0.42, "z", matSteel);
      vessel(group, "small-right-receiver", [5.06, 1.08, 2.64], 1.1, 0.27, "x", matSteel);

      verticalVessel(group, "main-vertical-column", 0.54, -0.34, 4.85, 0.39);
      verticalVessel(group, "rear-vertical-separator", -2.24, -2.15, 3.15, 0.34);
      verticalVessel(group, "right-vertical-column", 4.62, 1.0, 3.95, 0.33);
      verticalVessel(group, "left-small-column", -4.1, 2.24, 2.65, 0.28);
      cylinder(group, "exhaust-stack", [-5.18, 3.76, -2.78], 0.17, 6.42, matSteel, "y", 48);
      for (let y = 1.08; y < 6.8; y += 0.62) {
        cylinder(group, "stack-band", [-5.18, y, -2.78], 0.183, 0.035, matDarkSteel, "y", 36);
      }

      platform(group, -0.82, 2.65, -0.75, 5.2, 2.65);
      platform(group, 3.78, 3.42, -0.15, 2.88, 2.72);
      platform(group, -4.08, 2.34, -1.08, 2.15, 2.2);
      platform(group, -3.74, 1.85, 1.32, 2.05, 1.7);
      ladder(group, -1.92, 1.46, 0.52, 2.42);
      ladder(group, 2.96, 2.05, 0.52, 3.18);
      ladder(group, 4.82, -0.88, 0.52, 3.42);
      ladder(group, -4.92, -1.92, 0.52, 2.58);

      pump(group, -4.1, 0.86, -1.88, matBluePaint, 0.06);
      pump(group, -4.66, 0.82, 2.43, matBluePaint, -0.2);
      pump(group, 1.05, 0.78, 3.0, matBluePaint, 0.12);
      pump(group, 4.74, 0.78, 2.12, matGreen, -0.25);
      blower(group, -4.85, 0.9, 1.58, 0.12);
      blower(group, 3.35, 0.9, 0.82, -0.16);
      greenModule(group, 2.96, 0.92, 1.03, -0.08);
      greenModule(group, -4.7, 0.92, 1.7, 0.15);
      greenModule(group, 4.55, 0.86, -0.72, 0.08);

      const cabinet = new THREE.Group();
      cabinet.position.set(-3.86, 1.0, 1.16);
      box(cabinet, "control-cabinet", [0, 0, 0], [1.05, 1.28, 0.46], matCabinet);
      box(cabinet, "screen", [0, 0.27, 0.25], [0.66, 0.36, 0.04], matGlass);
      box(cabinet, "panel-line", [0, -0.22, 0.255], [0.72, 0.026, 0.045], matDarkSteel);
      group.add(cabinet);

      const cabinet2 = new THREE.Group();
      cabinet2.position.set(3.12, 0.98, 2.82);
      cabinet2.rotation.y = -0.18;
      box(cabinet2, "control-cabinet-main", [0, 0, 0], [0.72, 1.55, 0.46], matCabinet);
      box(cabinet2, "panel-screen", [0, 0.32, 0.25], [0.38, 0.28, 0.04], matGlass);
      box(cabinet2, "emergency-button", [0.2, -0.18, 0.255], [0.08, 0.08, 0.04], matRedPaint);
      group.add(cabinet2);

      for (let i = 0; i < 10; i += 1) {
        const x = -5.4 + i * 1.14;
        const z = i % 2 === 0 ? 3.08 : -3.04;
        cylinder(group, "small-drum", [x, 0.76, z], 0.14 + (i % 3) * 0.02, 0.62, i % 2 === 0 ? matSteel : matDarkSteel, "y", 28);
      }
    }

    function buildProcessPipes(group) {
      const runs = [
        [[-5.08, 1.46, 2.15], [-3.02, 1.46, 2.15], [-2.6, 2.06, 1.55], [-0.78, 2.55, 1.04], [0.54, 3.05, -0.34], [2.8, 3.08, -0.6], [4.6, 2.72, 0.98]],
        [[-2.16, 1.84, 2.16], [-2.56, 2.2, -1.72], [-0.58, 3.48, -1.08], [2.92, 3.42, -1.35], [4.18, 2.13, -2.45], [5.38, 2.13, -2.45]],
        [[0.54, 5.42, -0.34], [1.24, 5.1, -1.1], [3.95, 4.58, -1.35], [4.78, 4.52, -0.12], [4.78, 2.75, 1.05]],
        [[1.02, 0.95, 3.0], [2.24, 1.28, 2.65], [3.42, 1.22, 2.6], [5.06, 1.28, 2.64]],
        [[-5.18, 6.65, -2.78], [-4.38, 5.4, -2.22], [-2.2, 4.6, -2.15], [0.6, 4.95, -0.88]]
      ];

      runs.forEach((run, index) => {
        const mat = index === 4 ? matDarkSteel : (index === 2 ? matBrightSteel : matSteel);
        polyPipe(group, `process-line-${index}`, run, index === 2 ? 0.052 : 0.045, mat);
      });

      const verticalDrops = [
        [-2.95, 1.46, 2.15, 0.62],
        [-0.52, 3.48, -1.08, 2.72],
        [3.16, 3.42, -1.35, 0.92],
        [4.82, 2.72, 1.05, 0.78],
        [2.22, 1.28, 2.65, 0.74],
        [-4.24, 1.34, 0.82, 0.7]
      ];
      verticalDrops.forEach(([x, y, z, bottom]) => pipe(group, "vertical-drop", [x, bottom, z], [x, y, z], 0.038, matSteel, 16));

      [
        [-2.62, 1.52, 2.16], [-0.72, 2.54, 1.04], [0.98, 3.0, -0.5],
        [3.2, 2.14, -2.45], [2.78, 1.24, 2.62], [4.6, 2.74, 1.0],
        [-4.35, 5.36, -2.24], [4.9, 1.32, 2.64]
      ].forEach((p, i) => valve(group, p[0], p[1], p[2], i % 2 ? "z" : "x"));

      for (let i = 0; i < 16; i += 1) {
        const x = -5.3 + i * 0.68;
        pipe(group, "front-small-tube", [x, 0.82, 2.85], [x + 0.34, 1.18 + (i % 3) * 0.16, 2.34], 0.016, i % 4 === 0 ? matCopper : matDarkSteel, 8);
      }
    }

    function flange(group, x, y, z, radius = 0.12, axis = "x") {
      const f = cylinder(group, "flange", [x, y, z], radius, 0.055, matDarkSteel, axis, 32);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.08, 0.012, 8, 28), matBrightSteel);
      ring.position.set(x, y, z);
      if (axis === "x") ring.rotation.y = Math.PI / 2;
      if (axis === "z") ring.rotation.x = Math.PI / 2;
      group.add(setShadow(ring));
      return f;
    }

    function stair(group, x, y, z, width, height, depth, rot = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.y = rot;
      pipe(g, "stair-side-a", [-width / 2, 0, 0], [-width / 2, height, -depth], 0.022, matYellow, 8);
      pipe(g, "stair-side-b", [width / 2, 0, 0], [width / 2, height, -depth], 0.022, matYellow, 8);
      const steps = 9;
      for (let i = 0; i <= steps; i += 1) {
        const f = i / steps;
        pipe(g, "stair-step", [-width / 2, f * height, -f * depth], [width / 2, f * height, -f * depth], 0.018, matFrame, 8);
      }
      group.add(g);
      return g;
    }

    function instrument(group, x, y, z, rot = 0) {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      g.rotation.y = rot;
      const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.032, 30), matCabinet);
      dial.rotation.x = Math.PI / 2;
      g.add(setShadow(dial));
      const face = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.078, 0.036, 30), matGlass);
      face.rotation.x = Math.PI / 2;
      face.position.z = 0.018;
      g.add(setShadow(face));
      pipe(g, "tap", [0, -0.18, 0], [0, -0.02, 0], 0.012, matSteel, 8);
      group.add(g);
      return g;
    }

    function buildFineDetails(group) {
      const flangePoints = [
        [-4.68, 1.46, 2.15, 0.12, "x"], [-3.36, 1.46, 2.15, 0.12, "x"],
        [-1.68, 1.42, 2.16, 0.18, "x"], [-0.62, 1.42, 2.16, 0.18, "x"],
        [0.62, 1.43, -1.82, 0.16, "x"], [2.4, 1.43, -1.82, 0.16, "x"],
        [3.3, 4.08, -1.35, 0.17, "x"], [4.6, 4.08, -1.35, 0.17, "x"],
        [4.12, 1.36, -1.45, 0.15, "x"], [4.12, 1.36, -3.36, 0.15, "x"],
        [0.54, 4.45, -0.34, 0.18, "y"], [4.62, 3.2, 1.0, 0.15, "y"]
      ];
      flangePoints.forEach(p => flange(group, p[0], p[1], p[2], p[3], p[4]));

      for (let x = -5.55; x <= 5.55; x += 0.72) {
        pipe(group, "front-brace-a", [x, 0.46, 3.31], [x + 0.32, 1.08, 3.31], 0.014, matFrame, 8);
        pipe(group, "front-brace-b", [x + 0.32, 0.46, 3.17], [x, 1.08, 3.17], 0.014, matFrame, 8);
      }
      for (let x = -4.8; x <= 4.85; x += 0.84) {
        pipe(group, "rear-brace-a", [x, 0.55, -3.05], [x + 0.36, 1.4, -2.72], 0.014, matFrame, 8);
      }

      const cableTray = new THREE.Group();
      cableTray.position.set(-0.2, 2.06, 2.9);
      box(cableTray, "tray-floor", [0, 0, 0], [9.8, 0.035, 0.22], matDarkSteel);
      for (let x = -4.8; x <= 4.8; x += 0.32) {
        pipe(cableTray, "tray-rung", [x, 0.045, -0.1], [x, 0.045, 0.1], 0.006, matBrightSteel, 6);
      }
      pipe(cableTray, "tray-side", [-4.9, 0.08, -0.12], [4.9, 0.08, -0.12], 0.012, matFrame, 6);
      pipe(cableTray, "tray-side", [-4.9, 0.08, 0.12], [4.9, 0.08, 0.12], 0.012, matFrame, 6);
      group.add(cableTray);

      stair(group, -3.9, 0.52, 2.58, 0.58, 1.35, 1.02, -0.18);
      stair(group, 3.72, 0.52, 2.12, 0.58, 1.75, 1.18, 0.05);
      stair(group, 4.92, 0.52, -0.28, 0.54, 2.12, 1.24, Math.PI * 0.48);

      [
        [-3.34, 1.78, 2.22, 0], [-2.62, 1.76, 2.24, 0], [-1.18, 1.8, 2.24, 0],
        [0.2, 3.95, -0.24, 0.3], [0.74, 4.2, -0.52, 0.25], [3.36, 4.58, -1.12, -0.15],
        [4.88, 2.2, 1.15, -0.6], [-5.04, 2.52, -1.68, 0.2], [2.56, 1.62, 2.72, 0]
      ].forEach(([x, y, z, rot]) => instrument(group, x, y, z, rot));

      for (let y = 1.0; y < 5.8; y += 0.55) {
        const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.011, 8, 36), matYellow);
        hoop.position.set(-5.0, y, -2.5);
        hoop.rotation.x = Math.PI / 2;
        group.add(setShadow(hoop));
      }

      for (let i = 0; i < 24; i += 1) {
        const x = -5.2 + i * 0.46;
        const y = 1.78 + (i % 5) * 0.12;
        const z = i % 2 ? 2.17 : -2.42;
        box(group, "pipe-clamp", [x, y, z], [0.045, 0.08, 0.2], matDarkSteel);
      }

      [
        [-4.72, 2.24, -1.36], [-0.58, 3.84, -0.72], [3.95, 4.54, -0.92],
        [2.96, 1.3, 1.35], [4.55, 1.24, -0.36]
      ].forEach(([x, y, z]) => {
        const light = new THREE.PointLight(0xffd36a, 0.45, 1.4);
        light.position.set(x, y, z);
        group.add(light);
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 8), matYellow);
        lamp.position.set(x, y, z);
        group.add(setShadow(lamp));
      });

      [
        [-2.14, 1.86, 2.59, 4.2],
        [0.05, 1.84, -1.39, 4.8],
        [3.95, 4.52, -0.92, 1.8],
        [4.12, 1.75, -2.02, 1.7]
      ].forEach(([x, y, z, len]) => {
        cylinder(group, "blue-vessel-service-line", [x, y, z], 0.018, len, matBluePaint, "x", 10);
      });

      [
        [-3.15, 1.9, 2.58], [-1.1, 1.9, 2.58], [1.05, 1.9, -1.38],
        [3.7, 4.56, -0.92], [4.62, 2.7, 1.38], [-5.18, 3.2, -2.52]
      ].forEach(([x, y, z]) => {
        const tag = box(group, "red-instrument-tag", [x, y, z], [0.13, 0.09, 0.018], matRedPaint);
        tag.rotation.y = 0.28;
      });
    }

    buildBase(root);
    buildEquipment(root);
    buildPipeRack(root);
    buildProcessPipes(root);
    buildFineDetails(root);

    const targetRotation = { value: 0 };
    let currentRotation = -0.14;

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "equipment-rotation") {
        targetRotation.value = (event.data.rotation || 0) - 0.14;
      }
    });

    function resize() {
      const w = sceneEl.clientWidth;
      const h = sceneEl.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / Math.max(1, h);
      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);
    resize();

    function animate() {
      requestAnimationFrame(animate);
      currentRotation += (targetRotation.value - currentRotation) * 0.055;
      root.rotation.y = currentRotation;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
