<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新闻版块 - 石家庄辰泰环境科技有限公司</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="news-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="返回首页">
        <img src="assets/logo/chentai-logo-full.jpg" alt="石家庄辰泰环境科技有限公司" />
        <span>
          <strong>石家庄辰泰环境科技有限公司</strong>
          <small>Shijiazhuang Chentai Environmental Technology Co., Ltd.</small>
        </span>
      </a>
      <button class="menu-button" type="button" data-menu-button>☰</button>
      <nav class="nav" data-nav>
        <a href="index.html#profile" data-i18n="nav.profile">公司简介</a>
        <a href="index.html#qualifications" data-i18n="nav.qualifications">资质能力</a>
        <a href="index.html#business" data-i18n="nav.business">主营业务</a>
        <a href="index.html#products" data-i18n="nav.products">产品体系</a>
        <a href="news.html" data-i18n="nav.news">新闻版块</a>
        <a href="index.html#contact" data-i18n="nav.contact">联系我们</a>
        <button class="lang-toggle" type="button" data-lang-toggle>EN</button>
      </nav>
    </header>

    <main>
      <section class="news-hero">
        <p class="eyebrow">News Center</p>
        <h1 data-i18n="news.pageTitle">新闻版块</h1>
        <p data-i18n="news.pageCopy">集中查看公司新闻与行业资讯，保留旧网站新闻内容，并以更清晰的阅读方式呈现。</p>
      </section>

      <section class="section news-section">
        <div class="section-head with-action">
          <div>
            <p class="eyebrow">All Articles</p>
            <h2 data-i18n="news.allTitle">全部新闻资讯</h2>
          </div>
          <div class="news-tabs">
            <button class="is-active" type="button" data-news-filter="all" data-i18n="news.all">全部</button>
            <button type="button" data-news-filter="company" data-i18n="news.company">公司新闻</button>
            <button type="button" data-news-filter="industry" data-i18n="news.industry">行业资讯</button>
          </div>
        </div>
        <div class="news-grid" data-news-grid></div>
      </section>
    </main>

    <div class="modal" data-modal aria-hidden="true">
      <div class="modal-panel">
        <button class="modal-close" type="button" data-close-modal>×</button>
        <article data-modal-content></article>
      </div>
    </div>

    <footer class="footer">
      <span>石家庄辰泰环境科技有限公司</span>
      <span>Shijiazhuang Chentai Environmental Technology Co., Ltd.</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
